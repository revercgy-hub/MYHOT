<!doctype html><html><head><title>政策引领创新突破 厦门辖区债券市场融资呈现新亮点_监管工作</title><meta property="article:published_time" content="2026-09-28 14:31:07"></head><body><h1>厦门监管局</h1><h2>政策引领创新突破 厦门辖区债券市场融资呈现新亮点</h2><div class="detail-news"><p>厦门辖区债券市场融资呈现新亮点，监管部门持续引导辖区企业利用债券市场拓宽融资渠道。</p><p>2026年以来，辖区债券融资在发行主体和融资品种方面保持活跃，监管部门通过政策宣讲和业务指导支持符合条件的企业规范融资。</p><p>厦门证监局将继续提升服务质效，推动债券市场融资与实体经济发展相结合。监管部门将继续做好信息沟通和政策服务，支持符合条件的企业依据市场规则发行债券融资，增强融资服务实体经济的能力。</p><p>相关企业应关注债券发行条件和信息披露要求，结合自身经营情况制定融资计划，具体政策以监管部门及交易场所公开文件为准。</p></div></body></html>
