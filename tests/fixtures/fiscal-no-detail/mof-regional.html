<!doctype html><html><head><title>财政部宁夏监管局：以财政科学管理为统领推动过紧日子要求见行见效</title><meta name="PubDate" content="2026-10-12 08:41:00"></head><body><div class="my_doccontent"><h2 class="title_con">财政部宁夏监管局：以财政科学管理为统领推动过紧日子要求见行见效</h2><div class="TRS_Editor"><p>宁夏监管局围绕财政科学管理和过紧日子要求，结合预算执行监督开展政策传导与日常监测。</p><p>工作措施包括跟踪预算支出进度、核实重点单位支出事项，并对发现的问题督促整改，推动预算约束落到具体项目。</p><p>监管局表示将继续加强分析评估，及时反馈执行中的共性问题，促进财政资金规范高效使用。监管局还结合日常监管掌握的情况，对财政资金分配、预算执行和项目管理开展分析，推动相关单位及时整改发现的问题。</p><p>后续将继续加强制度执行和监督检查，促进预算管理更加规范、透明，保障财政资金用于重点领域和关键环节。</p></div></div></body></html>
