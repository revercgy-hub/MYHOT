<!doctype html><html><head><title>中华人民共和国财政部公告2026年第24号</title><meta name="PubDate" content="2026-08-26 10:22:00"></head><body><main class="box_content"><h2 class="title_con">中华人民共和国财政部公告2026年第24号</h2><div class="my_doccontent"><div class="TRS_Editor"><p>财政部公布2025年全国彩票销售情况。全年彩票销售总额为6279.69亿元，按规定筹集彩票公益金并安排中央彩票公益金。</p><p>公告列明彩票销售、公益金筹集与分配相关情况，供社会公众查阅。具体分地区销售情况和公益金安排以正文及附表为准。</p><p>各彩票发行机构应继续依法规范销售管理，做好信息公开和资金使用工作。财政部门按照有关规定持续公开彩票公益金的筹集、分配和使用信息，接受社会监督。有关机构应依法规范销售管理，确保资金使用符合政策要求。</p></div></div></main></body></html>
