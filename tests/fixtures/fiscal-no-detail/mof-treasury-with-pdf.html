<!doctype html><html><head><title>2026年8月地方政府债券发行和债务余额情况</title><meta name="PubDate" content="2026-09-24 14:52:00"></head><body><div class="box_content"><h2 class="title_con">2026年8月地方政府债券发行和债务余额情况</h2><div class="my_conboxzw"><div class="TRS_Editor"><p>2026年8月，全国发行地方政府债券，共计发行新增债券和再融资债券。地方政府债券余额按法定限额管理，相关发行和偿还数据以附表为准。</p><p>财政部按月公布地方政府债券发行和债务余额情况，附表提供各地区发行、还本付息及余额数据。</p><p><a href="/tjsj/202609/P020260924537898561808.pdf">附表 2026年8月地方政府债券发行和还本付息情况.pdf</a></p></div></div></div></body></html>
