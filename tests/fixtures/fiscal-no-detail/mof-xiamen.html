<!doctype html><html><head><title>财政部厦门监管局：办公室开展厦门市财政支持老旧水库除险加固工作专项调研</title><meta name="PubDate" content="2026-10-10 16:17:00"></head><body><div class="my_doccontent"><h2 class="title_con">财政部厦门监管局：办公室开展厦门市财政支持老旧水库除险加固工作专项调研</h2><div class="TRS_Editor"><p>厦门监管局办公室围绕厦门市财政支持老旧水库除险加固工作开展专项调研，了解项目建设、资金保障和后续运维情况。</p><p>调研组与有关单位交流项目推进中的实际问题，重点关注财政资金分担、工程进度和水库运行安全。</p><p>后续将结合调研情况加强沟通协调，推动有关资金政策落实，为水库安全运行和防洪保障提供支持。专项调研还关注工程建成后的管护责任、运行维护经费来源和风险排查安排，并与相关部门交换意见。</p><p>调研情况将用于后续政策沟通与工作协调，具体工程进度和资金安排以主管部门发布的信息为准。</p></div></div></body></html>
